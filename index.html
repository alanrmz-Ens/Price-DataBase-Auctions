<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Precios Subastas">
<meta name="theme-color" content="#0F1720">
<title>Precios Subastas</title>
<style>
  :root{
    --bg:#EEF1F5; --surface:#FFFFFF; --panel:#0F1720;
    --ink:#0F1720; --ink-soft:#5A6675; --border:#CBD3DE;
    --brand:#1D4ED8; --readout:#34D399;
    --ok:#15803D; --ok-bg:#E7F5EC; --warn:#B45309; --warn-bg:#FBF1E3;
    --high:#B91C1C; --high-bg:#FBEAEA;
    --num: ui-monospace,"SF Mono","Menlo","Consolas","Roboto Mono",monospace;
    --ui: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.35;
    -webkit-text-size-adjust:100%;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);}
  .wrap{max-width:920px;margin:0 auto;padding:0 14px}

  /* Top bar + tabs */
  .topbar{position:sticky;top:0;z-index:20;background:var(--bg);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0 8px;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.92rem;letter-spacing:-.01em;white-space:nowrap}
  .brand .dot{width:12px;height:12px;border-radius:3px;background:var(--brand)}
  .tabs{display:flex;background:#DCE2EA;border-radius:12px;padding:4px}
  .tabs button{border:0;background:transparent;font-family:var(--ui);font-weight:800;
    font-size:.9rem;padding:9px 16px;border-radius:9px;color:var(--ink-soft);cursor:pointer}
  .tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

  .eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-soft);margin:10px 0 6px}

  /* Compact inputs (DATOS) */
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .rowcap{display:grid;grid-template-columns:1.25fr 1fr auto;gap:8px}
  select,input[type=number]{width:100%;height:50px;border:2px solid var(--border);border-radius:11px;
    background:var(--surface);color:var(--ink);font-size:1rem;font-weight:700;padding:0 10px;font-family:var(--ui)}
  select:focus,input:focus,button:focus-visible{outline:3px solid #93C5FD;outline-offset:1px}
  .btn{height:50px;padding:0 16px;border:0;border-radius:11px;background:var(--brand);color:#fff;
    font-weight:800;font-size:1rem;font-family:var(--ui);cursor:pointer;white-space:nowrap}
  .btn:active{transform:translateY(1px)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--border)}
  .btn.danger{background:var(--high)}

  /* Readout panel */
  .panel{background:var(--panel);border-radius:16px;padding:16px;color:#fff;margin-top:10px}
  .panel .veh{font-size:.82rem;font-weight:800;color:#9FB0C3;letter-spacing:.02em;margin-bottom:10px}
  .duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .duo .cell .k{font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#8DA0B6}
  .duo .cell .v{font-family:var(--num);font-weight:800;font-size:2.15rem;line-height:1.05;color:var(--readout);letter-spacing:-.02em}
  .duo .cell.aucCell .v{color:#93C5FD}
  .duo .cell .v small{font-size:.7rem;color:#8DA0B6;margin-left:4px;font-weight:700}
  .vstrip{margin-top:12px;border-radius:10px;padding:11px 12px;font-weight:800;font-size:.95rem;display:flex;gap:8px;align-items:center}
  .vstrip.neutral{background:rgba(255,255,255,.08);color:#B8C4D2}
  .vstrip.ok{background:rgba(52,211,153,.16);color:#6EE7B7}
  .vstrip.warn{background:rgba(245,158,11,.16);color:#FCD34D}
  .vstrip.high{background:rgba(248,113,113,.16);color:#FCA5A5}
  .vstrip .big{font-size:1.02rem}
  .pfoot{margin-top:11px;font-size:.8rem;color:#9FB0C3;font-weight:700;display:flex;flex-wrap:wrap;gap:4px 14px}
  .pfoot b{color:#E4EAF1}
  .pfoot .limtap{background:transparent;border:0;color:#93C5FD;font-family:var(--ui);font-weight:800;font-size:.8rem;cursor:pointer;text-decoration:underline;padding:0}

  /* REPORTES */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .card h3{margin:0 0 4px;font-size:1rem;font-weight:800}
  .card .sub{font-size:.8rem;color:var(--ink-soft);font-weight:600;margin:0 0 12px}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px}
  .kpi .k{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  .kpi .v{font-family:var(--num);font-weight:800;font-size:1.35rem;margin-top:4px}
  .kpi .v.small{font-size:1rem}

  .bar{display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:8px;margin:7px 0}
  .bar .lbl{font-size:.82rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{background:var(--bg);border-radius:7px;height:22px;overflow:hidden;border:1px solid var(--border)}
  .bar .fill{height:100%;background:var(--brand);border-radius:6px}
  .bar.best .fill{background:var(--ok)}
  .bar .amt{font-family:var(--num);font-weight:800;font-size:.88rem;text-align:right;min-width:64px}
  .bar .amt .n{display:block;font-size:.62rem;color:var(--ink-soft);font-weight:700}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--border);font-size:.9rem}
  th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);font-weight:800}
  td.amt{font-family:var(--num);font-weight:800;text-align:right}
  .xbtn{width:38px;height:38px;border-radius:9px;border:2px solid var(--border);background:var(--surface);cursor:pointer;font-weight:800;color:var(--high)}
  .empty{padding:16px;text-align:center;color:var(--ink-soft);font-weight:700;background:var(--bg);border-radius:10px;font-size:.9rem}
  .btn-row{display:flex;flex-wrap:wrap;gap:8px}
  .oppitem{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
  .oppitem.good{border-color:var(--ok);background:var(--ok-bg)}
  .oppitem .lab{font-weight:800;font-size:.9rem}
  .oppitem .r{font-family:var(--num);font-weight:800;text-align:right;font-size:.85rem}
  .trendnote{font-size:.85rem;font-weight:700;margin-top:8px}
  svg.spark{width:100%;height:110px;display:block}

  .hide{display:none}

  @media(min-width:560px){
    .kpis{grid-template-columns:1fr 1fr 1fr 1fr}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand"><span class="dot"></span> PRECIOS SUBASTAS</div>
    <div class="tabs">
      <button id="tabDatos" class="on" onclick="showTab('datos')">DATOS</button>
      <button id="tabRep" onclick="showTab('rep')">REPORTES</button>
    </div>
  </div>

  <!-- ============ DATOS ============ -->
  <div id="viewDatos">
    <div class="eyebrow">Vehículo</div>
    <div class="row3">
      <select id="selMarca"></select>
      <select id="selAnio"></select>
      <select id="selModelo"></select>
    </div>

    <div class="eyebrow">Registrar / evaluar precio (USD)</div>
    <div class="rowcap">
      <select id="capAuction"></select>
      <input type="number" id="capPrecio" inputmode="decimal" min="0" step="100" placeholder="Ej. 21500">
      <button class="btn" id="capBtn">Agregar</button>
    </div>

    <div class="panel">
      <div class="veh" id="roVeh">Selecciona marca, año y modelo</div>
      <div class="duo">
        <div class="cell">
          <div class="k">Precio global</div>
          <div class="v" id="roGlobal">—</div>
        </div>
        <div class="cell aucCell">
          <div class="k" id="roAucK">Auction</div>
          <div class="v" id="roAuc">—</div>
        </div>
      </div>
      <div class="vstrip neutral" id="vstrip"><span class="big">Escribe un precio para evaluarlo</span></div>
      <div class="pfoot" id="pfoot"></div>
    </div>
  </div>

  <!-- ============ REPORTES ============ -->
  <div id="viewRep" class="hide">
    <div id="repContent"></div>
  </div>

</div>

<script>
/* ===== Catálogo ===== */
const AUCTIONS=["PHOENIX","TUCSON","FRESNO","OCEANSIDE","RIVERSIDE","SOUTHERN CALIFORNIA","SAN FRANCISCO","NEVADA","EL PASO","SAN ANTONIO"];
const YEARS=[2017,2018,2019,2020,2021,2022,2023];
const MARCAS={
  "CHEVROLET":["COLORADO","SILVERADO"],
  "FORD":["BRONCO","F-150","F-250","RANGER"],
  "GMC":["SIERRA","YUKON"],
  "JEEP":["GLADIATOR","WRANGLER"],
  "NISSAN":["FRONTIER"],
  "RAM":["1500","2500"],
  "TOYOTA":["TACOMA","TUNDRA"]
};

/* ===== Estado ===== */
const LS_REG="vsub_registros",LS_LIM="vsub_limites";
let registros=load(LS_REG,[]), limites=load(LS_LIM,{});
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("No se pudo guardar.")}}

/* ===== Utilidades ===== */
const usd=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const $=id=>document.getElementById(id);
const key=(m,a,mo)=>m+"|"+a+"|"+mo;
const sel=()=>({marca:$("selMarca").value,anio:$("selAnio").value,modelo:$("selModelo").value});
const complete=s=>s.marca&&s.anio&&s.modelo;
const vlabel=s=>s.marca+" · "+s.anio+" · "+s.modelo;
const regsOf=s=>registros.filter(r=>r.marca===s.marca&&r.anio==s.anio&&r.modelo===s.modelo);
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const money=n=>usd.format(Math.round(n));
const kfmt=n=>n>=1000?("$"+(n/1000).toFixed(n>=10000?0:1)+"k"):("$"+Math.round(n));

/* ===== Poblar selects ===== */
function fill(el,items,ph){el.innerHTML="<option value=''>"+ph+"</option>"+items.map(i=>`<option value="${i}">${i}</option>`).join("")}
fill($("selMarca"),Object.keys(MARCAS),"Marca");
fill($("selAnio"),YEARS,"Año");
fill($("selModelo"),[],"Modelo");
fill($("capAuction"),AUCTIONS,"Auction");

$("selMarca").addEventListener("change",()=>{const m=$("selMarca").value;fill($("selModelo"),m?MARCAS[m]:[],"Modelo");render()});
$("selAnio").addEventListener("change",render);
$("selModelo").addEventListener("change",render);
$("capAuction").addEventListener("change",render);
$("capPrecio").addEventListener("input",render);

/* ===== Tabs ===== */
function showTab(t){
  const d=t==="datos";
  $("viewDatos").classList.toggle("hide",!d);
  $("viewRep").classList.toggle("hide",d);
  $("tabDatos").classList.toggle("on",d);
  $("tabRep").classList.toggle("on",!d);
  if(!d) renderReportes();
}

/* ===== Render DATOS ===== */
function render(){
  const s=sel(), ok=complete(s);
  const rs=ok?regsOf(s):[];
  const prices=rs.map(r=>r.precio);
  const g=avg(prices);
  const lim=ok?(limites[key(s.marca,s.anio,s.modelo)]??null):null;
  const aucName=$("capAuction").value;
  const aucAvg=aucName?avg(rs.filter(r=>r.auction===aucName).map(r=>r.precio)):null;

  $("roVeh").textContent = ok?vlabel(s):"Selecciona marca, año y modelo";
  $("roGlobal").innerHTML = g!=null?money(g)+"<small>USD</small>":"—";
  $("roAucK").textContent = aucName?("Auction · "+aucName):"Auction";
  $("roAuc").innerHTML = aucAvg!=null?money(aucAvg):"—";

  // Verdict / status
  const typed=parseFloat($("capPrecio").value);
  const vs=$("vstrip");
  if(ok && !isNaN(typed) && typed>0){
    const v=verdict(typed,g,lim);
    vs.className="vstrip "+v.cls;
    vs.innerHTML=`<span class="big">${v.big}</span>&nbsp;— ${v.detail}`;
  } else if(!ok){
    vs.className="vstrip neutral"; vs.innerHTML='<span class="big">Elige el vehículo para empezar</span>';
  } else if(g==null){
    vs.className="vstrip neutral"; vs.innerHTML='<span class="big">Sin precios aún. Captura el primero.</span>';
  } else if(lim!=null){
    if(g<=lim){vs.className="vstrip ok";vs.innerHTML=`<span class="big">✓ Promedio dentro de tu límite</span>&nbsp;(${money(lim)})`;}
    else{vs.className="vstrip high";vs.innerHTML=`<span class="big">▲ Promedio supera tu límite</span>&nbsp;(${money(lim)})`;}
  } else {
    vs.className="vstrip neutral"; vs.innerHTML='<span class="big">Escribe un precio para evaluarlo</span>';
  }

  // Footer: muestras · mín · máx · límite(tap)
  const pf=$("pfoot");
  const mn=prices.length?money(Math.min(...prices)):"—";
  const mx=prices.length?money(Math.max(...prices)):"—";
  pf.innerHTML =
    `<span><b>${prices.length}</b> muestras</span>`+
    `<span>mín <b>${mn}</b></span>`+
    `<span>máx <b>${mx}</b></span>`+
    `<span>límite <button class="limtap" id="limTap">${lim!=null?money(lim):"definir"}</button></span>`;
  $("limTap").onclick=setLimite;
}

function verdict(p,g,lim){
  if(lim!=null && p>lim)
    return {cls:"high",big:"PRECIO ALTO — NO COMPRAR",detail:`US$${nfmt(p)} arriba de tu límite (${money(lim)})`};
  if(g==null){
    if(lim!=null) return {cls:"ok",big:"DENTRO DE TU LÍMITE",detail:`US$${nfmt(p)} por debajo de ${money(lim)}. Sin promedio aún.`};
    return {cls:"neutral",big:"SIN REFERENCIA",detail:"Aún no hay promedio ni límite."};
  }
  const d=(p-g)/g;
  if(p<=g)      return {cls:"ok",  big:"BUENA OPORTUNIDAD",   detail:`${pct(d)} debajo del promedio (${money(g)})`};
  if(d<=0.03)   return {cls:"warn",big:"EN EL PROMEDIO",      detail:`~${money(g)} de promedio`};
  return                {cls:"warn",big:"ARRIBA DEL PROMEDIO", detail:`${pct(d)} sobre el promedio (${money(g)})`};
}
const nfmt=n=>new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(Math.round(n));
const pct=d=>Math.abs(d*100).toFixed(1)+"%";

/* ===== Capturar (fecha automática) ===== */
$("capBtn").addEventListener("click",()=>{
  const s=sel();
  if(!complete(s)){alert("Primero selecciona marca, año y modelo.");return;}
  const a=$("capAuction").value, p=parseFloat($("capPrecio").value);
  if(!a){alert("Elige la auction.");return;}
  if(isNaN(p)||p<=0){alert("Escribe un precio válido.");return;}
  registros.push({id:Date.now(),marca:s.marca,anio:Number(s.anio),modelo:s.modelo,auction:a,precio:p,fecha:new Date().toISOString().slice(0,10)});
  save(LS_REG,registros);
  $("capPrecio").value="";
  render();
});

/* ===== Límite (tap) ===== */
function setLimite(){
  const s=sel();
  if(!complete(s)){alert("Primero selecciona el vehículo.");return;}
  const k=key(s.marca,s.anio,s.modelo);
  const cur=limites[k]!=null?limites[k]:"";
  const val=prompt("Límite máximo de compra para "+vlabel(s)+" (USD).\nDeja vacío para quitarlo:",cur);
  if(val===null) return;
  const n=parseFloat(val);
  if(val.trim()==="" ){ delete limites[k]; }
  else if(isNaN(n)||n<=0){ alert("Valor no válido."); return; }
  else { limites[k]=Math.round(n); }
  save(LS_LIM,limites); render();
}

/* ===== REPORTES ===== */
function renderReportes(){
  const s=sel(), c=$("repContent");
  const hasData=registros.length>0;
  let html="";

  /* Resumen */
  html+=`<div class="card"><h3>Resumen general</h3>`;
  if(!hasData){ html+=`<div class="empty">Aún no capturas precios. Ve a la pestaña DATOS y registra los primeros.</div></div>`; }
  else{
    const vehSet=new Set(registros.map(r=>key(r.marca,r.anio,r.modelo)));
    // auction más barata en general
    const aucAvgAll=AUCTIONS.map(a=>({a,v:avg(registros.filter(r=>r.auction===a).map(r=>r.precio))})).filter(x=>x.v!=null);
    const bestAuc=aucAvgAll.length?aucAvgAll.reduce((m,x)=>x.v<m.v?x:m):null;
    // modelo más barato (global)
    const modMap={};
    registros.forEach(r=>{(modMap[r.marca+" "+r.modelo]=modMap[r.marca+" "+r.modelo]||[]).push(r.precio)});
    const modAvg=Object.entries(modMap).map(([k,arr])=>({k,v:avg(arr)}));
    const bestMod=modAvg.length?modAvg.reduce((m,x)=>x.v<m.v?x:m):null;
    html+=`<div class="kpis">
      <div class="kpi"><div class="k">Registros</div><div class="v">${registros.length}</div></div>
      <div class="kpi"><div class="k">Vehículos con datos</div><div class="v">${vehSet.size}</div></div>
      <div class="kpi"><div class="k">Auction más barata</div><div class="v small">${bestAuc?bestAuc.a:"—"}</div></div>
      <div class="kpi"><div class="k">Modelo más barato</div><div class="v small">${bestMod?bestMod.k:"—"}</div></div>
    </div></div>`;
  }

  /* Oportunidades activas */
  const opps=Object.keys(limites).map(k=>{
    const [m,a,mo]=k.split("|");
    const g=avg(registros.filter(r=>r.marca===m&&r.anio==a&&r.modelo===mo).map(r=>r.precio));
    return {k,m,a,mo,lim:limites[k],g};
  }).filter(o=>o.g!=null);
  html+=`<div class="card"><h3>Oportunidades</h3><p class="sub">Vehículos cuyo promedio está por debajo (o cerca) de tu límite.</p>`;
  if(!opps.length){ html+=`<div class="empty">Define límites de compra (toca "límite · definir" en DATOS) para ver señales aquí.</div>`; }
  else{
    opps.sort((x,y)=>(x.g-x.lim)-(y.g-y.lim));
    html+=opps.map(o=>{
      const good=o.g<=o.lim, diff=(o.g-o.lim);
      return `<div class="oppitem ${good?'good':''}"><div><div class="lab">${o.m} · ${o.a} · ${o.mo}</div><div class="sub" style="margin:2px 0 0">${good?'Mercado favorable':'Por arriba del límite'}</div></div>
      <div class="r">${money(o.g)}<br><span style="color:var(--ink-soft);font-size:.72rem">límite ${money(o.lim)}</span></div></div>`;
    }).join("");
  }
  html+=`</div>`;

  /* Ranking de auctions del vehículo seleccionado */
  html+=`<div class="card"><h3>Ranking de auctions</h3>`;
  if(!complete(s)){ html+=`<p class="sub">Selecciona un vehículo en DATOS.</p><div class="empty">Sin vehículo seleccionado.</div>`; }
  else{
    html+=`<p class="sub">${vlabel(s)} — de más barata a más cara.</p>`;
    const rs=regsOf(s);
    const rows=AUCTIONS.map(a=>{const p=rs.filter(r=>r.auction===a).map(r=>r.precio);return{a,v:avg(p),n:p.length}}).filter(x=>x.v!=null).sort((x,y)=>x.v-y.v);
    if(!rows.length){ html+=`<div class="empty">Sin precios para este vehículo todavía.</div>`; }
    else{ const mx=Math.max(...rows.map(r=>r.v));
      html+=rows.map((r,i)=>`<div class="bar ${i===0?'best':''}"><div class="lbl">${r.a}</div><div class="track"><div class="fill" style="width:${Math.max(8,r.v/mx*100)}%"></div></div><div class="amt">${money(r.v)}<span class="n">${r.n} m.</span></div></div>`).join("");
    }
  }
  html+=`</div>`;

  /* Comparativo de modelos (global) */
  html+=`<div class="card"><h3>Comparativo de modelos</h3><p class="sub">Precio global promedio por modelo (todos los datos).</p>`;
  if(!hasData){ html+=`<div class="empty">Sin datos.</div>`; }
  else{
    const mm={};
    registros.forEach(r=>{const k=r.marca+" "+r.modelo;(mm[k]=mm[k]||[]).push(r.precio)});
    const rows=Object.entries(mm).map(([k,arr])=>({k,v:avg(arr),n:arr.length})).sort((x,y)=>x.v-y.v);
    const mx=Math.max(...rows.map(r=>r.v));
    html+=rows.map((r,i)=>`<div class="bar ${i===0?'best':''}"><div class="lbl">${r.k}</div><div class="track"><div class="fill" style="width:${Math.max(8,r.v/mx*100)}%"></div></div><div class="amt">${money(r.v)}<span class="n">${r.n} m.</span></div></div>`).join("");
  }
  html+=`</div>`;

  /* Tendencia */
  html+=`<div class="card"><h3>Tendencia de precios</h3>`;
  if(!complete(s)){ html+=`<p class="sub">Selecciona un vehículo en DATOS.</p><div class="empty">Sin vehículo seleccionado.</div>`; }
  else{
    const rs=regsOf(s).slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||"")||a.id-b.id);
    html+=`<p class="sub">${vlabel(s)} — evolución de precios capturados.</p>`;
    if(rs.length<2){ html+=`<div class="empty">Necesitas al menos 2 precios para ver la tendencia.</div>`; }
    else{ html+=spark(rs.map(r=>r.precio)); const first=rs[0].precio,last=rs[rs.length-1].precio,d=(last-first)/first;
      const up=last>first;
      html+=`<div class="trendnote" style="color:${up?'var(--high)':'var(--ok)'}">${up?'▲ Subiendo':'▼ Bajando'} ${pct(d)} · del ${money(first)} al ${money(last)}</div>`;
    }
  }
  html+=`</div>`;

  /* Datos capturados */
  html+=`<div class="card"><h3>Datos capturados</h3>`;
  if(!complete(s)){ html+=`<p class="sub">Selecciona un vehículo en DATOS.</p><div class="empty">Sin vehículo seleccionado.</div>`; }
  else{
    const rs=regsOf(s).slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||"")||b.id-a.id);
    html+=`<p class="sub">${vlabel(s)}</p>`;
    if(!rs.length){ html+=`<div class="empty">Sin precios para este vehículo.</div>`; }
    else{ html+=`<table><thead><tr><th>Fecha</th><th>Auction</th><th style="text-align:right">Precio</th><th></th></tr></thead><tbody>`+
      rs.map(r=>`<tr><td>${r.fecha||"—"}</td><td>${r.auction}</td><td class="amt">${money(r.precio)}</td><td style="text-align:right"><button class="xbtn" data-del="${r.id}">✕</button></td></tr>`).join("")+
      `</tbody></table>`;
    }
  }
  html+=`</div>`;

  /* Respaldo */
  html+=`<div class="card"><h3>Respaldo y datos</h3><p class="sub">Descarga tu respaldo seguido: si el navegador borra sus datos, lo restauras.</p>
    <div class="btn-row">
      <button class="btn ghost" id="exJson">Respaldo (JSON)</button>
      <button class="btn ghost" id="exCsv">Exportar Excel (CSV)</button>
      <button class="btn ghost" id="imBtn">Restaurar</button>
      <input type="file" id="imFile" accept="application/json" hidden>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn danger" id="clrAll">Borrar todo</button>
    </div>
  </div>`;

  c.innerHTML=html;

  // wiring
  c.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=Number(b.dataset.del);registros=registros.filter(r=>r.id!==id);save(LS_REG,registros);renderReportes();render();});
  $("exJson").onclick=()=>download("respaldo-precios-subastas.json",JSON.stringify({registros,limites,exportado:new Date().toISOString()},null,2),"application/json");
  $("exCsv").onclick=()=>{const h="MARCA,ANO,MODELO,AUCTION,PRECIO_USD,FECHA";const l=registros.map(r=>[r.marca,r.anio,r.modelo,r.auction,r.precio,r.fecha].join(","));download("precios-subastas.csv","\ufeff"+[h,...l].join("\n"),"text/csv");};
  $("imBtn").onclick=()=>$("imFile").click();
  $("imFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.registros)throw 0;if(!confirm("Esto reemplaza tus datos actuales. ¿Continuar?"))return;registros=d.registros||[];limites=d.limites||{};save(LS_REG,registros);save(LS_LIM,limites);renderReportes();render();alert("Respaldo restaurado.");}catch(err){alert("Archivo no válido.");}};rd.readAsText(f);e.target.value="";};
  $("clrAll").onclick=()=>{if(!confirm("¿Borrar TODOS los datos?"))return;if(!confirm("Confirma otra vez: se borra todo."))return;registros=[];limites={};save(LS_REG,registros);save(LS_LIM,limites);renderReportes();render();};
}

/* mini sparkline SVG */
function spark(vals){
  const w=600,h=110,pad=8;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{const x=pad+i*(w-2*pad)/(vals.length-1);const y=h-pad-(v-mn)/rng*(h-2*pad);return [x,y]});
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pad} ${h-pad} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${w-pad} ${h-pad} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#1D4ED8"/>`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="${area}" fill="rgba(29,78,216,.10)"/>
    <path d="${line}" fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-linejoin="round"/>
    ${dots}</svg>`;
}

/* util descarga */
function download(name,content,type){const b=new Blob([content],{type});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500);}

/* init */
render();
</script>
</body>
